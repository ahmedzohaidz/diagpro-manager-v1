<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#carGradient)"/>

  <!-- Glow effects -->
  <circle cx="300" cy="200" r="150" fill="#FFD100" opacity="0.05" filter="url(#glow)"/>
  <circle cx="1000" cy="400" r="200" fill="#FFD100" opacity="0.03" filter="url(#glow)"/>

  <!-- Car Body -->
  <g>
    <!-- Car base -->
    <ellipse cx="600" cy="380" rx="280" ry="80" fill="#1a1a1a" stroke="#FFD100" stroke-width="2"/>

    <!-- Main body -->
    <path d="M 380 380 L 420 250 L 520 200 L 680 200 L 780 250 L 820 380"
          fill="#222222" stroke="#FFD100" stroke-width="2.5"/>

    <!-- Hood -->
    <path d="M 520 200 Q 600 160 680 200 L 680 240 L 520 240 Z"
          fill="#333333" stroke="#FFD100" stroke-width="2"/>

    <!-- Windshield -->
    <path d="M 540 240 L 660 240 L 680 280 L 520 280 Z"
          fill="#1a3a4a" opacity="0.6" stroke="#FFD100" stroke-width="1.5"/>

    <!-- Roof -->
    <ellipse cx="600" cy="260" rx="100" ry="50" fill="#1a1a1a" stroke="#FFD100" stroke-width="2"/>

    <!-- Rear window -->
    <path d="M 520 280 L 680 280 L 700 320 L 500 320 Z"
          fill="#1a3a4a" opacity="0.5" stroke="#FFD100" stroke-width="1.5"/>

    <!-- Left Wheel -->
    <circle cx="450" cy="380" r="60" fill="#222222" stroke="#FFD100" stroke-width="2"/>
    <circle cx="450" cy="380" r="45" fill="none" stroke="#444444" stroke-width="3"/>
    <circle cx="450" cy="380" r="30" fill="#111111" stroke="#FFD100" stroke-width="1.5"/>

    <!-- Right Wheel -->
    <circle cx="750" cy="380" r="60" fill="#222222" stroke="#FFD100" stroke-width="2"/>
    <circle cx="750" cy="380" r="45" fill="none" stroke="#444444" stroke-width="3"/>
    <circle cx="750" cy="380" r="30" fill="#111111" stroke="#FFD100" stroke-width="1.5"/>

    <!-- Headlights with glow -->
    <circle cx="420" cy="310" r="15" fill="#FFD100" opacity="0.8" filter="url(#glow)"/>
    <circle cx="420" cy="310" r="12" fill="#FFFF00" opacity="0.6"/>

    <circle cx="780" cy="310" r="15" fill="#FFD100" opacity="0.8" filter="url(#glow)"/>
    <circle cx="780" cy="310" r="12" fill="#FFFF00" opacity="0.6"/>

    <!-- Diagnostic Equipment lines -->
    <line x1="550" y1="320" x2="550" y2="360" stroke="#FFD100" stroke-width="2" opacity="0.5"/>
    <line x1="600" y1="320" x2="600" y2="360" stroke="#FFD100" stroke-width="2" opacity="0.5"/>
    <line x1="650" y1="320" x2="650" y2="360" stroke="#FFD100" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Diagnostic scanner -->
  <g transform="translate(200, 100)">
    <rect x="0" y="0" width="120" height="150" rx="8" fill="#222222" stroke="#FFD100" stroke-width="2"/>
    <rect x="10" y="15" width="100" height="70" fill="#1a3a4a" stroke="#FFD100" stroke-width="1.5" opacity="0.8"/>
    <circle cx="60" cy="100" r="12" fill="#FFD100" opacity="0.8"/>
    <circle cx="30" cy="130" r="6" fill="#FFD100" opacity="0.6"/>
    <circle cx="60" cy="130" r="6" fill="#FFD100" opacity="0.6"/>
    <circle cx="90" cy="130" r="6" fill="#FFD100" opacity="0.6"/>
  </g>

  <!-- Highlight accent -->
  <path d="M 420 200 Q 600 150 780 200" stroke="#FFD100" stroke-width="1.5" fill="none" opacity="0.4" stroke-dasharray="5,5"/>

  <!-- Text elements -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#FFD100">
    فحص ذكي احترافي
  </text>
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#CCCCCC" opacity="0.8">
    أجهزة حديثة • فنيون متخصصون • تقارير دقيقة
  </text>
</svg>
